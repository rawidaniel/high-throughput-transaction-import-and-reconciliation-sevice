services:
  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-transactions}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-transactions}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Migrations — runs once, then exits
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-transactions}?schema=public
    command: ['npx', 'prisma', 'migrate', 'deploy']

  # API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-transactions}?schema=public
      PORT: 3000
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      UPLOAD_STORAGE_DIR: /app/storage/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-524288000}
      JSON_BODY_LIMIT_BYTES: ${JSON_BODY_LIMIT_BYTES:-65536}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-300000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1 minute}
      MAX_CONCURRENT_UPLOADS: ${MAX_CONCURRENT_UPLOADS:-10}
      SHUTDOWN_GRACE_MS: ${SHUTDOWN_GRACE_MS:-15000}
      SHUTDOWN_DRAIN_MS: ${SHUTDOWN_DRAIN_MS:-3000}
    ports:
      - '${API_PORT:-3000}:3000'
    volumes:
      - upload-storage:/app/storage/uploads
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/health/live', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    command: ['node', 'dist/src/main']

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-transactions}?schema=public
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      UPLOAD_STORAGE_DIR: /app/storage/uploads
      WORKER_METRICS_PORT: 3001
      PERSIST_BATCH_SIZE: ${PERSIST_BATCH_SIZE:-500}
      SCORING_BATCH_SIZE: ${SCORING_BATCH_SIZE:-500}
      MAX_CONCURRENT_PERSISTS: ${MAX_CONCURRENT_PERSISTS:-2}
      WORKER_POOL_SIZE: ${WORKER_POOL_SIZE:-4}
      RISK_SCORING_HASH_ROUNDS: ${RISK_SCORING_HASH_ROUNDS:-600}
      LEASE_DURATION_MS: ${LEASE_DURATION_MS:-120000}
      MAX_JOB_ATTEMPTS: ${MAX_JOB_ATTEMPTS:-3}
      RECLAIM_INTERVAL_MS: ${RECLAIM_INTERVAL_MS:-30000}
      WORKER_SHUTDOWN_GRACE_MS: ${WORKER_SHUTDOWN_GRACE_MS:-30000}
      RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-4}
      METRICS_SAMPLE_INTERVAL_MS: ${METRICS_SAMPLE_INTERVAL_MS:-5000}
    ports:
      - '${WORKER_METRICS_PORT:-3001}:3001'
    volumes:
      - upload-storage:/app/storage/uploads
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3001/health/live', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 45s
    command: ['node', 'dist/src/worker.main']

volumes:
  postgres-data:
  upload-storage:
